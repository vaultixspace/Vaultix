<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaultix - Dashboard</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #F5F5F5;
      color: #2C3E50;
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(90deg, #4CAF50, #2C3E50);
      color: white;
      text-align: center;
      padding: 25px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 30px auto;
    }

    .card {
      background-color: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
    }

    .badge {
      background-color: #4CAF50;
      color: white;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fas fa-tachometer-alt"></i> Vaultix Dashboard</h1>
  </header>

  <div class="container">

    <div class="card">
      <h2><i class="fas fa-wallet"></i> Wallet</h2>
      <p>Balance: $0 <span class="badge">Active</span></p>
    </div>

    <div class="card">
      <h2><i class="fas fa-chart-line"></i> Investments</h2>
      <p>No active investments <span class="badge">None</span></p>
    </div>

  </div>

</body>
</html>
