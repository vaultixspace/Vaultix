<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaultix - Login & Signup</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #F5F5F5;
      color: #2C3E50;
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(90deg, #4CAF50, #2C3E50);
      color: white;
      text-align: center;
      padding: 25px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: 30px auto;
    }

    .card {
      background-color: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      padding: 10px 15px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }

    .message {
      text-align: center;
      color: green;
      font-weight: bold;
      margin: 10px 0;
    }

  </style>
</head>
<body>

  <header>
    <h1><i class="fas fa-coins"></i> Vaultix</h1>
  </header>

  <div class="container">

    <!-- Login Card -->
    <div class="card">
      <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
      <input type="text" id="loginUser" placeholder="Username">
      <input type="password" id="loginPass" placeholder="Password">
      <button onclick="login()"><i class="fas fa-arrow-right"></i> Login</button>
      <div id="loginMessage" class="message"></div>
    </div>

    <!-- Signup Card -->
    <div class="card">
      <h2><i class="fas fa-user-plus"></i> Signup</h2>
      <input type="text" id="signupUser" placeholder="Username">
      <input type="password" id="signupPass" placeholder="Password">
      <button onclick="signup()"><i class="fas fa-check"></i> Signup</button>
      <div id="signupMessage" class="message"></div>
    </div>

  </div>

  <script>
    function login() {
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      if(user && pass) {
        document.getElementById('loginMessage').innerText = "Login successful!";
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } else {
        document.getElementById('loginMessage').innerText = "Please enter username and password.";
      }
    }

    function signup() {
      const user = document.getElementById('signupUser').value;
      const pass = document.getElementById('signupPass').value;
      if(user && pass) {
        document.getElementById('signupMessage').innerText = "Signup successful!";
      } else {
        document.getElementById('signupMessage').innerText = "Please fill all fields.";
      }
    }
  </script>
</body>
</html>
