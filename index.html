<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaultix</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    .container { max-width: 500px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
    h1, h2 { text-align: center; color: #2c3e50; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { width: 100%; padding: 10px; border: none; border-radius: 5px; background-color: #2c3e50; color: #fff; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #34495e; }
    .message { text-align: center; margin-top: 10px; }
    .section { margin-top: 30px; }
    .wallet, .investments { padding: 20px; background: #ecf0f1; border-radius: 10px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div class="container" id="loginForm">
    <h2>Login</h2>
    <input type="text" id="loginUsername" placeholder="Username" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button id="loginBtn">Login</button>
    <div id="loginMessage" class="message"></div>
  </div>

  <!-- Signup Section -->
  <div class="container section" id="signupForm">
    <h2>Sign Up</h2>
    <input type="text" id="signupUsername" placeholder="Username" required>
    <input type="email" id="signupEmail" placeholder="Email" required>
    <input type="password" id="signupPassword" placeholder="Password" required>
    <input type="password" id="signupConfirm" placeholder="Confirm Password" required>
    <button id="signupBtn">Sign Up</button>
    <div id="signupMessage" class="message"></div>
  </div>

  <!-- Wallet Section -->
  <div class="container section wallet" id="walletSection">
    <h2>Wallet</h2>
    <p>Balance: $0.00</p>
    <button>Add Funds</button>
  </div>

  <!-- Investments Section -->
  <div class="container section investments" id="investmentsSection">
    <h2>Investments</h2>
    <p>No active investments yet.</p>
    <button>Invest Now</button>
  </div>

<script>
  // ---------- LOGIN ----------
  document.getElementById("loginBtn").addEventListener("click", function() {
    const username = document.getElementById("loginUsername").value;
    const password = document.getElementById("loginPassword").value;
    const loginMessage = document.getElementById("loginMessage");

    if(username && password){
      loginMessage.textContent = "Login successful! Redirecting...";
      loginMessage.style.color = "green";

      setTimeout(() => {
        window.location.href = "dashboard.html"; // redirect to dashboard
      }, 1000);
    } else {
      loginMessage.textContent = "Please enter username and password";
      loginMessage.style.color = "red";
    }
  });

  // ---------- SIGNUP ----------
  document.getElementById("signupBtn").addEventListener("click", function(){
    const username = document.getElementById("signupUsername").value;
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;
    const confirm = document.getElementById("signupConfirm").value;
    const signupMessage = document.getElementById("signupMessage");

    if(!username || !email || !password || !confirm){
      signupMessage.textContent = "Please fill in all fields";
      signupMessage.style.color = "red";
      return;
    }

    if(password !== confirm){
      signupMessage.textContent = "Passwords do not match";
      signupMessage.style.color = "red";
      return;
    }

    signupMessage.textContent = "Signup successful!";
    signupMessage.style.color = "green";

    // clear fields
    document.getElementById("signupUsername").value = "";
    document.getElementById("signupEmail").value = "";
    document.getElementById("signupPassword").value = "";
    document.getElementById("signupConfirm").value = "";
  });
</script>

</body>
</html>
