<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaultix - Login & Signup</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #F5F5F5;
      color: #2C3E50;
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(90deg, #4CAF50, #2C3E50);
      color: white;
      text-align: center;
      padding: 25px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .container {
      display: flex;
      justify-content: center;
      margin: 30px auto;
      max-width: 900px;
    }

    .form-container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      display: none; /* hidden by default, JS will show login */
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }

    button:hover {
      background-color: #45a049;
      transform: scale(1.03);
      transition: transform 0.2s, background-color 0.2s;
    }

    .message {
      text-align: center;
      margin-top: 10px;
      font-weight: 500;
    }

    .toggle-link {
      text-align: center;
      margin-top: 10px;
    }

    .toggle-link a {
      color: #4CAF50;
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }

    .toggle-link a:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>

  <header>
    <h1><i class="fas fa-lock"></i> Vaultix</h1>
  </header>

  <div class="container">

    <!-- Login Form -->
    <div class="form-container" id="loginForm">
      <h2>Sign In</h2>
      <input type="text" id="loginUser" placeholder="Username">
      <input type="password" id="loginPass" placeholder="Password">
      <button onclick="login()">Login</button>
      <p id="loginMessage" class="message"></p>
      <div class="toggle-link">
        Don't have an account? <a onclick="showSignup()">Sign Up</a>
      </div>
    </div>

    <!-- Signup Form -->
    <div class="form-container" id="signupForm">
      <h2>Sign Up</h2>
      <input type="text" id="signupUser" placeholder="Username">
      <input type="password" id="signupPass" placeholder="Password">
      <button onclick="signup()">Signup</button>
      <p id="signupMessage" class="message"></p>
      <div class="toggle-link">
        Already have an account? <a onclick="showLogin()">Sign In</a>
      </div>
    </div>

  </div>

  <script>
    // Show login by default
    document.getElementById('loginForm').style.display = 'block';

    function showSignup() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }

    function login() {
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      const msg = document.getElementById('loginMessage');

      if(user && pass) {
        msg.innerText = "Login successful!";
        msg.style.transition = "opacity 0.8s";
        msg.style.opacity = 1;

        setTimeout(() => {
          msg.style.opacity = 0;
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 500); // faster redirect
        }, 700); // shorter message display
      } else {
        msg.innerText = "Please enter username and password.";
      }
    }

    function signup() {
      const user = document.getElementById('signupUser').value;
      const pass = document.getElementById('signupPass').value;
      const msg = document.getElementById('signupMessage');

      if(user && pass) {
        msg.innerText = "Signup successful!";
        msg.style.transition = "opacity 0.8s";
        msg.style.opacity = 1;

        setTimeout(() => {
          msg.style.opacity = 0;
        }, 1000);
      } else {
        msg.innerText = "Please fill all fields.";
      }
    }
  </script>

</body>
</html>
